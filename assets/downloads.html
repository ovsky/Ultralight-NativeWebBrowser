<html>

<head>
    <meta charset="utf-8" />
    <title>Downloads</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23222' d='M5 20h14v-2H5v2m7-18l-5 6h3v6h4v-6h3l-5-6z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" type="text/css" href="ui.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Dark purple theme matching Passwords & Settings */
            --bg-primary: #1e1e2e;
            --bg-secondary: #282839;
            --bg-tertiary: #32324a;
            --bg-hover: #3d3d5c;
            --text-primary: #e4e4ef;
            --text-secondary: #9999b3;
            --text-tertiary: #71718a;
            --border-color: #404060;
            --accent-color: #7c6aef;
            --accent-hover: #9182f3;
            --accent-light: rgba(124, 106, 239, 0.15);
            --danger-color: #ef6a6a;
            --success-color: #6aef8a;
            --warning-color: #efcf6a;
            --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        html,
        body {
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto !important;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #252540 100%);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            opacity: 0;
            animation: ul_fade_in 0.3s ease forwards;
            -webkit-animation: ul_fade_in 0.3s ease forwards;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 600;
            margin: 0;
        }

        h1::before {
            content: '⬇️';
            font-size: 32px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent-color);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 12px rgba(124, 106, 239, 0.4);
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        .btn-danger:hover {
            background: #f37878;
            box-shadow: 0 4px 12px rgba(239, 106, 106, 0.4);
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .item {
            padding: 16px 20px;
            border-radius: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            transition: all 0.2s;
        }

        .item:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(124, 106, 239, 0.2);
        }

        .item h2 {
            margin: 0 0 12px 0;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            word-break: break-word;
        }

        .meta {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 12px;
        }

        .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status {
            font-weight: 600;
            text-transform: capitalize;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
        }

        .status.in-progress {
            background: var(--accent-light);
            color: var(--accent-color);
        }

        .status.completed {
            background: rgba(106, 239, 138, 0.15);
            color: var(--success-color);
        }

        .status.failed,
        .status.cancelled {
            background: rgba(239, 106, 106, 0.15);
            color: var(--danger-color);
        }

        .progress {
            position: relative;
            height: 8px;
            border-radius: 999px;
            background: var(--bg-tertiary);
            overflow: hidden;
            margin: 12px 0;
        }

        .progress span {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-color), var(--accent-hover));
            transition: width 0.3s ease;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .actions .btn {
            font-size: 13px;
            padding: 6px 14px;
        }

        .empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .empty::before {
            content: '⬇️';
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .empty p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(124, 106, 239, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(124, 106, 239, 0.5);
        }

    @keyframes ul_fade_in { from { opacity: 0; } to { opacity: 1; } }
    @-webkit-keyframes ul_fade_in { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Downloads</h1>
            <div class="controls">
                <button id="clear-btn" class="btn">Clear finished</button>
            </div>
        </header>
        <section id="content">
            <div id="empty" class="empty" style="display: none;">
                <h2>No Downloads Yet</h2>
                <p>Your downloads will appear here</p>
            </div>
            <div id="list" class="list"></div>
        </section>
    </div>

    <script>
        function fmtBytes(bytes) {
            if (bytes === null || bytes === undefined || bytes < 0) return '';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let value = bytes;
            let unit = 0;
            while (value >= 1024 && unit < units.length - 1) {
                value /= 1024;
                unit++;
            }
            return value.toFixed(value >= 10 ? 0 : 1) + ' ' + units[unit];
        }

        function fmtTime(ms) {
            if (!ms) return '';
            try {
                return new Date(ms).toLocaleString();
            } catch (e) {
                return '';
            }
        }

        function render(data) {
            const list = document.getElementById('list');
            const empty = document.getElementById('empty');
            list.innerHTML = '';
            const items = (data && data.items) || [];
            if (!items.length) {
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            for (const item of items) {
                const card = document.createElement('div');
                card.className = 'item';

                const title = document.createElement('h2');
                title.textContent = item.filename || '(unknown file)';
                card.appendChild(title);

                const meta = document.createElement('div');
                meta.className = 'meta';
                const status = document.createElement('span');
                status.className = 'status ' + (item.status || 'pending').toLowerCase().replace(/[^a-z-]/g, '');
                status.textContent = item.status || 'pending';
                meta.appendChild(status);

                if (item.total > 0) {
                    const size = document.createElement('span');
                    size.textContent = fmtBytes(item.received) + ' / ' + fmtBytes(item.total);
                    meta.appendChild(size);
                } else if (item.received > 0) {
                    const size = document.createElement('span');
                    size.textContent = fmtBytes(item.received);
                    meta.appendChild(size);
                }

                if (item.url) {
                    const urlSpan = document.createElement('span');
                    urlSpan.textContent = item.url;
                    meta.appendChild(urlSpan);
                }

                const started = fmtTime(item.startedAt);
                if (started) {
                    const startSpan = document.createElement('span');
                    startSpan.textContent = 'Started: ' + started;
                    meta.appendChild(startSpan);
                }
                const finished = fmtTime(item.finishedAt);
                if (finished) {
                    const finishSpan = document.createElement('span');
                    finishSpan.textContent = 'Finished: ' + finished;
                    meta.appendChild(finishSpan);
                }
                if (item.error) {
                    const errSpan = document.createElement('span');
                    errSpan.textContent = item.error;
                    meta.appendChild(errSpan);
                }

                card.appendChild(meta);

                if (item.status === 'in-progress' || item.status === 'requested') {
                    const progress = document.createElement('div');
                    progress.className = 'progress';
                    const bar = document.createElement('span');
                    let percent = 0;
                    if (item.total > 0) {
                        percent = Math.min(100, Math.max(0, (item.received / item.total) * 100));
                    } else if (item.received > 0) {
                        percent = 100;
                    }
                    bar.style.width = percent.toFixed(1) + '%';
                    progress.appendChild(bar);
                    card.appendChild(progress);
                }

                const actions = document.createElement('div');
                actions.className = 'actions';

                if (item.canOpen) {
                    const openBtn = document.createElement('button');
                    openBtn.className = 'btn';
                    openBtn.textContent = 'Open';
                    openBtn.addEventListener('click', () => {
                        try { if (window.NativeOpenDownload) NativeOpenDownload(item.id); } catch { }
                    });
                    actions.appendChild(openBtn);
                }

                if (item.canReveal) {
                    const revealBtn = document.createElement('button');
                    revealBtn.className = 'btn';
                    revealBtn.textContent = 'Show in folder';
                    revealBtn.addEventListener('click', () => {
                        try { if (window.NativeRevealDownload) NativeRevealDownload(item.id); } catch { }
                    });
                    actions.appendChild(revealBtn);
                }

                card.appendChild(actions);
                list.appendChild(card);
            }
        }

        function refresh() {
            try {
                if (window.NativeGetDownloads) {
                    const json = NativeGetDownloads();
                    const data = JSON.parse(json || '{"items":[]}');
                    render(data);
                    return;
                }
            } catch (e) { }
            render({ items: [] });
        }

        document.getElementById('clear-btn').addEventListener('click', () => {
            try { if (window.NativeClearDownloads) NativeClearDownloads(); } catch { }
            refresh();
        });

        window.__ul_downloads_ready = function () {
            refresh();
        };

        document.addEventListener('DOMContentLoaded', () => {
            let tries = 0;
            const tick = () => {
                if (window.NativeGetDownloads) { refresh(); return; }
                if (++tries < 20) setTimeout(tick, 100);
            };
            tick();
        });

        window.addEventListener('focus', () => refresh());
        document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
        setInterval(refresh, 1500);
    </script>
</body>

</html>
