# .github/workflows/build-all-x64.yml
#
# OPTIMIZED: Orchestrates all x64 builds with maximum parallelization

name: Build - All x64

permissions:
  contents: read
  actions: write

concurrency:
  group: build-all-x64-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: "Override ULTRALIGHT_SDK_URL"
        required: false
        type: string
      version:
        description: "Override ULTRALIGHT_VERSION (eg. 1.4.0)"
        required: false
        type: string
      webbrowser_version:
        description: "Override build version name (default 'dev')"
        required: false
        type: string
      package_format:
        description: "Package format(s) for macOS/Linux"
        required: false
        type: string

jobs:
  # All x64 builds run in parallel
  windows:
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit
    with:
      sdk_url: ${{ inputs.sdk_url }}
      version: ${{ inputs.version }}
      webbrowser_version: ${{ inputs.webbrowser_version }}

  macos-x64:
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit
    with:
      sdk_url: ${{ inputs.sdk_url }}
      version: ${{ inputs.version }}
      webbrowser_version: ${{ inputs.webbrowser_version }}
      package_format: ${{ inputs.package_format }}

  linux-x64:
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit
    with:
      sdk_url: ${{ inputs.sdk_url }}
      version: ${{ inputs.version }}
      webbrowser_version: ${{ inputs.webbrowser_version }}
      package_format: ${{ inputs.package_format }}
