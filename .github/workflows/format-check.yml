name: Format Check

on: [pull_request]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install clang-format
      run: |
        sudo apt-get update -y
        sudo apt-get install -y clang-format

    - name: Run clang-format check
      run: |
        ./scripts/format-code.ps1 -CheckOnly
      shell: pwsh
