# .github/workflows/build-windows.yml
#
# OPTIMIZED: Fast Windows build with caching, sccache, and parallel builds
# Optimizations: shallow checkout, SDK caching, compiler caching, parallel jobs

name: Build - Windows

permissions:
  contents: read
  actions: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: "Override ULTRALIGHT_SDK_URL"
        required: false
        type: string
      version:
        description: "Override ULTRALIGHT_VERSION (eg. 1.4.0)"
        required: false
        type: string
      webbrowser_version:
        description: "Override build version name (default 'dev')"
        required: false
        type: string
      create_installer:
        description: "Create Windows installer via CPack (NSIS)"
        required: false
        type: boolean
      development_build:
        description: "Development build (verbose logs)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      sdk_url:
        required: false
        type: string
      version:
        required: false
        type: string
      webbrowser_version:
        required: false
        type: string
      create_installer:
        required: false
        type: boolean
        default: false
      development_build:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    env:
      ULTRALIGHT_SDK_URL: ${{ inputs.sdk_url || github.event.inputs.sdk_url }}
      ULTRALIGHT_VERSION: ${{ inputs.version || github.event.inputs.version }}
      WEBBROWSER_VERSION: ${{ inputs.webbrowser_version || github.event.inputs.webbrowser_version || 'dev' }}
      CREATE_INSTALLER: ${{ inputs.create_installer || github.event.inputs.create_installer }}
      DEVELOPMENT_BUILD: ${{ inputs.development_build || github.event.inputs.development_build || 'false' }}
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: "1. Checkout Code (shallow)"
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 1

      # ===== CACHING FOR SPEED =====
      - name: "2. Setup sccache"
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: "2.1 Cache SDK"
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdk-cache
          key: windows-sdk-${{ hashFiles('data/include/Ultralight/Defines.h') }}-v2
          restore-keys: |
            windows-sdk-

      - name: "2.2 Cache vcpkg"
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
          key: windows-vcpkg-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            windows-vcpkg-

      - name: "3. Detect SDK URL"
        id: detect_url
        shell: pwsh
        run: |
          if ($env:ULTRALIGHT_SDK_URL) { Write-Host "SDK URL provided"; exit 0 }
          $api = "https://api.github.com/repos/${{ github.repository }}/contents/sdks?ref=base-sdk"
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          try { $resp = Invoke-RestMethod -Uri $api -Headers $headers -Method Get } catch { $resp = $null }
          if ($resp) {
            $names = @($resp | Where-Object { $_.type -eq 'file' } | ForEach-Object { $_.name })
            $candidates = @($names | Where-Object { $_ -match '^ultralight(-free)?-sdk-.*-(win|windows)-x64\.7z$' })
            if ($candidates.Count -gt 0) {
              $best = $null
              foreach ($f in $candidates) {
                $m = [regex]::Match($f, '([0-9]+\.[0-9]+\.[0-9]+)')
                if ($m.Success) {
                  $ver = [version]$m.Groups[1].Value
                  if (-not $best -or $ver -gt $best.Version) { $best = [pscustomobject]@{ Version=$ver; File=$f } }
                }
              }
              if ($best) {
                $url = "https://raw.githubusercontent.com/${{ github.repository }}/base-sdk/sdks/$($best.File)"
                "ULTRALIGHT_SDK_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                "ULTRALIGHT_VERSION=$($best.Version.ToString())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                exit 0
              }
            }
          }
          $version = '1.4.0'
          $url = "https://raw.githubusercontent.com/${{ github.repository }}/base-sdk/sdks/ultralight-free-sdk-$version-win-x64.7z"
          "ULTRALIGHT_SDK_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: "4. Prepare SDK"
        id: prep_sdk
        shell: pwsh
        run: |
          $cacheDir = "$env:RUNNER_TEMP/sdk-cache"
          $root = "$cacheDir/sdk"
          if ((Test-Path "$root/include") -and (Test-Path "$root/lib")) {
            Write-Host "Using cached SDK at $root"
            "ULTRALIGHT_SDK_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "present=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          Write-Host "Downloading SDK..."
          $pkg = "$env:RUNNER_TEMP/ultralight-sdk.7z"
          Invoke-WebRequest -Uri $env:ULTRALIGHT_SDK_URL -OutFile $pkg
          New-Item -ItemType Directory -Force -Path "$cacheDir/extract" | Out-Null
          & 7z x -y -o"$cacheDir/extract" "$pkg" | Out-Null
          $rootFound = Get-ChildItem -Path "$cacheDir/extract" -Recurse -Directory | Where-Object { 
            (Test-Path (Join-Path $_.FullName 'include')) -and (Test-Path (Join-Path $_.FullName 'lib'))
          } | Select-Object -First 1
          if ($rootFound) {
            Move-Item -Force $rootFound.FullName $root
            "ULTRALIGHT_SDK_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "present=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Error "SDK extraction failed"; exit 1
          }

      - name: "5. Install libcurl"
        shell: pwsh
        run: pwsh -File "${{ github.workspace }}\scripts\install_curl.ps1"

      - name: "6. Configure CMake"
        if: steps.prep_sdk.outputs.present == 'true'
        shell: pwsh
        run: |
          $installerFlag = if ("$env:CREATE_INSTALLER" -match '^(true|1|on)$') { 'ON' } else { 'OFF' }
          $vcpkgToolchain = if ($env:VCPKG_ROOT) { "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" } else { "" }
          # Use Visual Studio with sccache for compiler caching
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DULTRALIGHT_SDK_ROOT="$env:ULTRALIGHT_SDK_ROOT" `
            -DBUILD_TESTING=ON `
            -DAUTO_INSTALL_CURL=ON `
            -DCREATE_INSTALLER=$installerFlag `
            -DWEBBROWSER_VERSION="$env:WEBBROWSER_VERSION" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            $vcpkgToolchain

      - name: "7. Build Project"
        shell: pwsh
        run: |
          $cores = $env:NUMBER_OF_PROCESSORS
          cmake --build build --config Release --parallel $cores

      - name: "8. Run tests"
        run: ctest --test-dir build -C Release --output-on-failure -j4

      - name: "9. Install NSIS"
        if: ${{ inputs.create_installer == true || github.event_name == 'pull_request' }}
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path "$nsisPath\makensis.exe") { $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      - name: "10. Package (CPack)"
        if: ${{ inputs.create_installer == true }}
        shell: pwsh
        run: |
          pushd build
          cpack -C Release -G ZIP
          if (Get-Command makensis -ErrorAction SilentlyContinue) { cpack -C Release -G NSIS 2>&1 | Out-Null }
          popd

      - name: "11. Rename packages"
        if: ${{ inputs.create_installer == true }}
        shell: pwsh
        run: |
          $version = "$env:WEBBROWSER_VERSION"
          $zip = Get-ChildItem -Path build -Filter "*.zip" -File -Recurse | Select-Object -First 1
          if ($zip) { Move-Item -Force $zip.FullName "Ultralight-WebBrowser-$version-Windows-x64.zip" }
          $installer = Get-ChildItem -Path build -Include "*.exe","*.msi" -File -Recurse | Where-Object { $_.Name -match 'Ultralight' } | Select-Object -First 1
          if ($installer) { Move-Item -Force $installer.FullName "Ultralight-WebBrowser-$version-Windows-Installer$($installer.Extension)" }

      - name: "12. Create portable archive"
        shell: pwsh
        run: |
          $candidates = @('build\Release','build\bin\Release')
          $src = $null
          foreach ($p in $candidates) { if (Test-Path $p) { $src = $p; break } }
          if (-not $src) { throw "No output folder found" }
          $version = "$env:WEBBROWSER_VERSION"
          Compress-Archive -Path (Join-Path $src '*') -DestinationPath "Ultralight-WebBrowser-$version-Windows-Portable.zip" -Force

      - name: "13. Upload Portable"
        uses: actions/upload-artifact@v4
        with:
          name: ultralight-windows-build
          path: Ultralight-WebBrowser-*-Windows-Portable.zip
          if-no-files-found: warn

      - name: "14. Upload Installer"
        if: ${{ inputs.create_installer == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ultralight-windows-installer
          path: |
            Ultralight-WebBrowser-*-Windows-Installer.*
            Ultralight-WebBrowser-*-Windows-x64.zip
          if-no-files-found: warn
