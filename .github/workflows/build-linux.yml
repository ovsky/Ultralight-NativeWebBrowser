# .github/workflows/build-linux.yml
#
# OPTIMIZED: Fast Linux x64 build with caching, ccache, Ninja, and parallel builds
# Optimizations: shallow checkout, SDK caching, compiler caching, Ninja generator

name: Build - Linux (x64)

permissions:
  contents: read
  actions: write

concurrency:
  group: build-linux-x64-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: "Override ULTRALIGHT_SDK_URL"
        required: false
        type: string
      version:
        description: "Override ULTRALIGHT_VERSION (eg. 1.4.0)"
        required: false
        type: string
      webbrowser_version:
        description: "Override build version name (default 'dev')"
        required: false
        type: string
      package_format:
        description: "Package format(s) (eg. TGZ, DEB, RPM or 'TGZ;DEB;RPM')"
        required: false
        type: string
      development_build:
        description: "Development build (verbose logs)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      sdk_url:
        required: false
        type: string
      version:
        required: false
        type: string
      webbrowser_version:
        required: false
        type: string
      package_format:
        required: false
        default: "TGZ;DEB;RPM"
        type: string
      development_build:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ULTRALIGHT_SDK_URL: ${{ inputs.sdk_url || github.event.inputs.sdk_url }}
      ULTRALIGHT_VERSION: ${{ inputs.version || github.event.inputs.version }}
      WEBBROWSER_VERSION: ${{ inputs.webbrowser_version || github.event.inputs.webbrowser_version || 'dev' }}
      PACKAGE_GENERATORS: ${{ inputs.package_format || github.event.inputs.package_format || 'TGZ;DEB;RPM' }}
      DEVELOPMENT_BUILD: ${{ inputs.development_build || github.event.inputs.development_build || 'false' }}

    steps:
      - name: "1. Checkout Code (shallow)"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ===== CACHING FOR SPEED =====
      - name: "2. Setup ccache"
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-x64-${{ github.ref }}
          max-size: 500M

      - name: "2.1 Cache SDK"
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdk-cache
          key: linux-x64-sdk-${{ hashFiles('data/include/Ultralight/Defines.h') }}-v2
          restore-keys: |
            linux-x64-sdk-

      - name: "2.2 Cache apt packages"
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
          key: linux-apt-${{ runner.os }}-v1
          restore-keys: |
            linux-apt-

      - name: "3. Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build p7zip-full \
            libgtk-3-dev libwebkit2gtk-4.1-dev libnss3-dev \
            libgdk-pixbuf2.0-dev libxtst-dev libxss-dev \
            libdbus-glib-1-dev libcurl4-openssl-dev rpm fakeroot

      - name: "4. Detect SDK URL"
        id: detect_url
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ULTRALIGHT_SDK_URL:-}" ]; then echo "SDK URL provided"; exit 0; fi
          API="https://api.github.com/repos/${{ github.repository }}/contents/sdks?ref=base-sdk"
          RESP=$(curl -fLs -H "Authorization: Bearer ${GITHUB_TOKEN:-}" -H "Accept: application/vnd.github+json" "$API" || true)
          if [ -n "$RESP" ]; then
            NAMES=$(printf "%s" "$RESP" | grep -oE '"name"\s*:\s*"[^"]+"' | sed -E 's/.*"name"\s*:\s*"([^"]+)".*/\1/')
            BEST_VER="" BEST_FILE=""
            for f in $NAMES; do
              case "$f" in ultralight*-sdk-*-linux-x64.7z)
                v=$(echo "$f" | sed -E 's/^.*-([0-9]+\.[0-9]+\.[0-9]+)-linux-.*$/\1/')
                if [ -n "$v" ] && { [ -z "$BEST_VER" ] || [ "$(printf '%s\n%s' "$v" "$BEST_VER" | sort -V | tail -1)" = "$v" ]; }; then
                  BEST_VER="$v"; BEST_FILE="$f"
                fi
              ;; esac
            done
            if [ -n "$BEST_FILE" ]; then
              URL="https://raw.githubusercontent.com/${{ github.repository }}/base-sdk/sdks/$BEST_FILE"
              echo "ULTRALIGHT_SDK_URL=$URL" >> "$GITHUB_ENV"
              echo "ULTRALIGHT_VERSION=$BEST_VER" >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          VERSION="1.4.0"
          URL="https://raw.githubusercontent.com/${{ github.repository }}/base-sdk/sdks/ultralight-free-sdk-$VERSION-linux-x64.7z"
          echo "ULTRALIGHT_SDK_URL=$URL" >> "$GITHUB_ENV"

      - name: "5. Prepare SDK"
        id: prep_sdk
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="$RUNNER_TEMP/sdk-cache"
          ROOT="$CACHE_DIR/sdk"
          if [ -d "$ROOT/include" ] && [ -d "$ROOT/lib" ]; then
            echo "Using cached SDK at $ROOT"
            echo "ULTRALIGHT_SDK_ROOT=$ROOT" >> "$GITHUB_ENV"
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Downloading SDK..."
          mkdir -p "$CACHE_DIR/extract"
          curl -fL "$ULTRALIGHT_SDK_URL" -o "$RUNNER_TEMP/ultralight-sdk.7z"
          7z x -y -o"$CACHE_DIR/extract" "$RUNNER_TEMP/ultralight-sdk.7z"
          ROOT_FOUND=""
          while IFS= read -r -d '' dir; do
            if [ -d "$dir/include" ] && [ -d "$dir/lib" ]; then ROOT_FOUND="$dir"; break; fi
          done < <(find "$CACHE_DIR/extract" -mindepth 1 -maxdepth 3 -type d -print0)
          if [ -n "$ROOT_FOUND" ]; then
            mv "$ROOT_FOUND" "$ROOT"
            echo "ULTRALIGHT_SDK_ROOT=$ROOT" >> "$GITHUB_ENV"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::SDK extraction failed"; exit 1
          fi

      - name: "6. Configure CMake (Ninja)"
        if: steps.prep_sdk.outputs.present == 'true'
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DULTRALIGHT_SDK_ROOT="$ULTRALIGHT_SDK_ROOT" \
            -DBUILD_TESTING=ON \
            -DAUTO_INSTALL_CURL=ON \
            -DWEBBROWSER_VERSION="$WEBBROWSER_VERSION" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: "7. Build Project"
        if: steps.prep_sdk.outputs.present == 'true'
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          cmake --build build --parallel $(nproc)

      - name: "8. Run tests"
        if: steps.prep_sdk.outputs.present == 'true'
        run: ctest --test-dir build --output-on-failure -j$(nproc)

      - name: "9. Package (CPack)"
        if: steps.prep_sdk.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          outdir="${{ github.workspace }}/build"
          version="${WEBBROWSER_VERSION}"
          IFS=$';,' read -ra GEN_LIST <<< "${PACKAGE_GENERATORS}"
          for g in "${GEN_LIST[@]}"; do
            [ -z "$g" ] && continue
            gen=$(echo "$g" | tr '[:lower:]' '[:upper:]')
            echo "Running CPack for: $gen"
            cpack --config build/CPackConfig.cmake -C Release -G "$gen" -D CPACK_OUTPUT_FILE_PREFIX="$outdir"
          done
          # Rename packages
          for file in "$outdir"/*.tar.gz; do
            [ -f "$file" ] || continue
            mv "$file" "$outdir/Ultralight-WebBrowser-${version}-Linux-x64.tar.gz" 2>/dev/null || true
          done
          for file in "$outdir"/*.deb; do
            [ -f "$file" ] || continue
            mv "$file" "$outdir/Ultralight-WebBrowser-${version}-Linux-x64.deb" 2>/dev/null || true
          done
          for file in "$outdir"/*.rpm; do
            [ -f "$file" ] || continue
            mv "$file" "$outdir/Ultralight-WebBrowser-${version}-Linux-x64.rpm" 2>/dev/null || true
          done

      - name: "10. Upload Packages"
        if: steps.prep_sdk.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Ultralight-WebBrowser-${{ env.WEBBROWSER_VERSION }}-Linux-x64
          path: |
            ${{ github.workspace }}/build/Ultralight-WebBrowser-*-Linux-x64.tar.gz
            ${{ github.workspace }}/build/Ultralight-WebBrowser-*-Linux-x64.deb
            ${{ github.workspace }}/build/Ultralight-WebBrowser-*-Linux-x64.rpm
          if-no-files-found: warn
