# .github/workflows/build-all-arm.yml
#
# OPTIMIZED: Orchestrates all ARM64 builds with maximum parallelization

name: Build - All ARM64

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: "Override ULTRALIGHT_SDK_URL"
        required: false
        type: string
      version:
        description: "Override ULTRALIGHT_VERSION (eg. 1.4.0)"
        required: false
        type: string
      webbrowser_version:
        description: "Override build version name (default 'dev')"
        required: false
        type: string
      package_format:
        description: "Package format(s) for macOS/Linux"
        required: false
        type: string

jobs:
  # All ARM64 builds run in parallel
  macos-arm64:
    uses: ./.github/workflows/build-macos-arm64.yml
    secrets: inherit
    with:
      sdk_url: ${{ inputs.sdk_url }}
      version: ${{ inputs.version }}
      webbrowser_version: ${{ inputs.webbrowser_version }}
      package_format: ${{ inputs.package_format }}

  linux-arm64:
    uses: ./.github/workflows/build-linux-arm64.yml
    secrets: inherit
    with:
      sdk_url: ${{ inputs.sdk_url }}
      version: ${{ inputs.version }}
      webbrowser_version: ${{ inputs.webbrowser_version }}
      package_format: ${{ inputs.package_format }}
